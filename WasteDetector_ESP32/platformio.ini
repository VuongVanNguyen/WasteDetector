; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = test_servo

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<*> -<test_hcsr04.cpp> -<test_servo.cpp> -<test_motor.cpp> -<test_servo.cpp> -<test_motor_ir.cpp> -<test_full_cycle.cpp> -<test_motor_free.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    madhephaestus/ESP32Servo @ ^3.0.0

[env:test_hcsr04]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = -<*> +<test_hcsr04.cpp>

[env:test_servo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = -<*> +<test_servo.cpp>
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.0

[env:test_motor_ir]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<test_motor_ir.cpp> +<motion.cpp>
build_flags = -DMOTION_FAULT_LATCH=0

[env:test_full_cycle]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<test_full_cycle.cpp> +<task_realtime.cpp> +<motion.cpp>
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.0

[env:test_motor_free]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<test_motor_free.cpp>
